[app]
name = "Maria"
version = "0.2.0"
environment = "development"

[paths]
database = "database/maria.db"
logs = "logs"
system_prompt = "prompts/system_prompt.txt"

[filesystem]
default_root = "workspace"

[[filesystem.roots]]
name = "workspace"
path = "~/MariaWorkspace"
policy = "organize"
enabled = true

[[filesystem.roots]]
name = "project_maria"
path = ".."
policy = "read_only"
enabled = false

[logging]
level = "INFO"

[permissions]
require_confirmation = [
  "filesystem.rename",
  "filesystem.move"
]

deny = [
  "filesystem.delete",
  "filesystem.write"
]

# Reasoning stays disabled in this tracked file, which must never hold a
# host, model, or any other machine-specific value. Active settings belong
# only in the untracked, Git-ignored config/config.local.toml.
[reasoning]
enabled = false
